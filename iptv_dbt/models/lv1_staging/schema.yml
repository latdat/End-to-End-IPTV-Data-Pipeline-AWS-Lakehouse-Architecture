version: 2
# Khai báo models, tests, descriptions cho tầng staging.
models:
  - name: stg_iptv_logs
    description: "Dữ liệu IPTV đã được lọc bỏ is_fraudulent = false"
    columns:
      - name: event_id
        tests:
          - not_null
          - unique 
      - name: total_duration_seconds
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 86400
              severity: error 
      - name: app_name
        tests:
          - not_null
          - accepted_values:
              values: ['CHANNEL', 'VOD', 'CHILD', 'KPLUS', 'RELAX', 'SPORT', 'FIMS', 'APP']