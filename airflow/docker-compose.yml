version: '3.8'

x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${SECRET_KEY}

    # AWS credentials — luôn đọc từ .env, không hardcode
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_DEFAULT_REGION: ap-southeast-1

    # Pipeline config
    S3_BUCKET: iptv-latdat-bucket
    REDSHIFT_WORKGROUP: iptv-workgroup
    REDSHIFT_DATABASE: dev
    REDSHIFT_IAM_ROLE: ${REDSHIFT_IAM_ROLE}  

    # dbt config — khai báo tường minh, không phụ thuộc vào default trong DAG
    DBT_PROJECT_DIR: /opt/airflow/iptv_dbt
    DBT_PROFILES_DIR: /opt/airflow/iptv_dbt
    DBT_BIN: /home/airflow/.local/bin/dbt

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ../iptv_dbt:/opt/airflow/iptv_dbt

  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname IPTV \
          --lastname Admin \
          --role Admin \
          --email admin@iptv.local
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # Không khai báo lại volumes — Docker Compose không merge list,
    # khai báo lại sẽ override hoàn toàn anchor và mất plugins/ + config/ mount.
    restart: unless-stopped

volumes:
  postgres_data: